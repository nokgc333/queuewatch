version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      # One pull request per week for every Python update: the "update requirement" bumps
      # raise a floor (CI already installs the latest), so they are safe to review together.
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      # One pull request per week for every Python update: the "update requirement" bumps
      # raise a floor (CI already installs the latest), so they are safe to review together.
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The ESLint plugins the lint config relies on do not support ESLint 10 yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 7 adds the React Compiler rules and fails the current code;
      # adopting them is a lint-config task, not a version bump.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      # React 19.3 adds 8.5 kB (gzip) to the initial JS and breaks the 68 kB bundle budget
      # (64.9 kB -> 73.4 kB). Patch releases still come; lift this when the budget is revisited.
      - dependency-name: react
        update-types: ["version-update:semver-minor"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # The base image follows .nvmrc (Node 22), not the newest Node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
