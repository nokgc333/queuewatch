name: CI Docker

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "docker-compose*.yml", ".github/workflows/ci-docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose*.yml", ".github/workflows/ci-docker.yml"]
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack with the default settings
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: The API is up and reaches Redis with its password
        run: curl --fail --silent http://127.0.0.1:8000/healthz | grep -q '"redis":"ok"'
      - name: Redis is not published to the host
        run: |
          if docker compose port redis 6379 | grep -q .; then
            echo "Redis must not be published by the default compose file"; exit 1
          fi
      - name: Redis refuses a client without the password
        run: |
          if docker compose exec -T redis redis-cli ping | grep -q PONG; then
            echo "Redis answered without a password"; exit 1
          fi
      - name: The dashboard is served by nginx with a CSP
        run: |
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'self'"
      - name: A job can be submitted and is stored
        run: |
          curl --fail --silent -X POST http://127.0.0.1:8000/jobs \
            -H "Content-Type: application/json" -d '{"name":"smoke"}'
          curl --fail --silent http://127.0.0.1:8000/jobs | grep -q smoke
      - name: Containers do not run as root
        run: |
          for service in backend worker frontend; do
            user=$(docker compose exec -T $service id -u)
            test "$user" != "0" || { echo "$service runs as root"; exit 1; }
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
