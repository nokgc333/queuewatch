name: CI Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/ci-frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/ci-frontend.yml']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  build:
    runs-on: ubuntu-latest
    needs: [unit-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Initial JS stays within the bundle budget
        run: node scripts/bundle-budget.mjs dist

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start the backend with demo data
        working-directory: backend
        env:
          QUEUEWATCH_CORS_ORIGINS: http://localhost:4173
        run: |
          pip install -r requirements-runtime.in
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 &
          sleep 3
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 &
          sleep 4
          mkdir -p lighthouse
          for page in "" "stats" "dead" "jobs/1"; do
            npx --yes lighthouse@12 "http://localhost:4173/$page" \
              --only-categories=performance,accessibility,seo,best-practices \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="lighthouse/$(echo "$page" | tr '/' '_')index.json" --quiet
          done
          node scripts/assert-lighthouse.mjs lighthouse/*.json
