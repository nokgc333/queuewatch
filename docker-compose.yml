services:
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-queuewatch-local-redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment: &backend-env
      DATABASE_URL: sqlite:////app/data/queuewatch.db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-queuewatch-local-redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-queuewatch-local-redis}@redis:6379/0
      QUEUEWATCH_AUTH_MODE: ${QUEUEWATCH_AUTH_MODE:-local}
      QUEUEWATCH_API_TOKENS: ${QUEUEWATCH_API_TOKENS:-}
      QUEUEWATCH_CORS_ORIGINS: ${QUEUEWATCH_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    command: >
      celery -A app.worker worker
      -Q queue_high,queue_normal,queue_low
      --concurrency=4
      --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_ORIGIN: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
