# 観測性の追加: `docker compose -f docker-compose.yml -f docker-compose.observability.yml up`
# Prometheus(9090)と Grafana(3000)を、ホストの 127.0.0.1 にだけ公開する。
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-queuewatch-local-grafana}
    volumes:
      - ./ops/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
